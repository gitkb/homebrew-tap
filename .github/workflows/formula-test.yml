name: formula-test

# Runs on every PR, with no `paths:` filter, so the `formula-test` check
# always reports and can be a required status check: a required check that a
# path filter skips never reports, and the PR waits on it forever. A formula
# bump must prove its binaries install and run on every platform the tap
# supports before auto-merge may land it; auto-merge waits only on required
# checks, so `formula-test` must be required in the `Protect main` ruleset.
on:
  pull_request:

concurrency:
  group: formula-test-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  changed:
    name: find formulae to test
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.changed.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          # actions/checkout resolves a PR to the *merge* ref with depth 1, so
          # neither the base nor the head commit is present in the object
          # store. Full history makes both resolvable for the diff below.
          fetch-depth: 0

      - name: Identify changed formulae
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Fail loudly if either commit is missing rather than letting an
          # errored `git diff` return empty output, which looks identical to
          # "no formula changed" and hides the real cause.
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::error::commit $sha not present in the checkout" >&2
              exit 1
            fi
          done

          # Assigned on its own line so a git failure aborts the step under
          # `set -e` instead of being swallowed.
          changed="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA")"
          # A change to the test itself re-tests every formula. Otherwise
          # only Added/Copied/Modified/Renamed formulae: a deleted formula
          # has nothing left to install.
          if grep -qxE '\.github/workflows/formula-test\.yml|scripts/smoke-test\.sh' <<<"$changed"; then
            files="$(ls Formula/*.rb)"
          else
            files="$(grep -xE 'Formula/[^/]+\.rb' <<<"$changed" || true)"
          fi
          files="$(tr '\n' ' ' <<<"$files" | xargs)"
          echo "Formulae to test: ${files:-none}" >&2
          echo "files=$files" >> "$GITHUB_OUTPUT"

  smoke:
    name: install and run (${{ matrix.os }})
    needs: changed
    if: needs.changed.outputs.files != ''
    strategy:
      fail-fast: false
      matrix:
        # The tap's support contract: every OS/architecture pair the
        # formulae have a url/sha256 for, on its native runner.
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install and smoke-test (macOS)
        if: runner.os == 'macOS'
        env:
          FILES: ${{ needs.changed.outputs.files }}
        run: |
          # shellcheck disable=SC2086 # FILES: space-separated, word-split on purpose
          scripts/smoke-test.sh "$PWD" $FILES

      # Homebrew's own image: a minimal Ubuntu at Homebrew's glibc floor, so
      # a binary that needs a newer glibc or a library the formula doesn't
      # provide fails here. A stock runner has both and would hide it.
      - name: Install and smoke-test (Homebrew on Linux)
        if: runner.os == 'Linux'
        env:
          FILES: ${{ needs.changed.outputs.files }}
        run: |
          # shellcheck disable=SC2086 # FILES: space-separated, word-split on purpose
          docker run --rm -v "$PWD:/src:ro" homebrew/brew /src/scripts/smoke-test.sh /src $FILES

  # The one check to require: a matrix job reports one check per OS, and a
  # skipped job (no formula changed) must still count as passing.
  formula-test:
    needs: [changed, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGED: ${{ needs.changed.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          echo "changed: $CHANGED, smoke: $SMOKE"
          [ "$CHANGED" = success ] && { [ "$SMOKE" = success ] || [ "$SMOKE" = skipped ]; }
